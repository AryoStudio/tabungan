<!DOCTYPE html>

                    "on-tertiary-fixed-variant": "#6c391e",

<style>
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fb; transition: background-color 0.3s ease, color 0.3s ease; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    
    body.dark-mode {
        background-color: #121212;
        color: #e0e0e0;
    }
    body.dark-mode .bg-surface,
    body.dark-mode .bg-surface-container-lowest,
    body.dark-mode .bg-surface-container-low,
    body.dark-mode .bg-slate-50\/80,
    body.dark-mode .bg-white\/90,
    body.dark-mode .bg-gradient-to-r,
    body.dark-mode .bg-gradient-to-br {
        background-color: #1e1e1e !important;
        color: #e0e0e0 !important;
    }
    body.dark-mode .text-primary,
    body.dark-mode .text-on-surface-variant,
    body.dark-mode .text-on-surface,
    body.dark-mode .text-slate-500 {
        color: #e0e0e0 !important;
    }
    body.dark-mode .text-secondary {
        color: #4edea3 !important;
    }
    body.dark-mode .border-outline-variant\/20 {
        border-color: #333 !important;
    }
    body.dark-mode .bg-emerald-50 {
        background-color: #1a3a2a !important;
    }
    body.dark-mode .text-emerald-600 {
        color: #4edea3 !important;
    }
</style>
</head>
<body class="text-on-background antialiased selection:bg-secondary-container selection:text-on-secondary-container">

<header class="sticky top-0 z-40 bg-slate-50/80 backdrop-blur-md shadow-[0_12px_32px_rgba(0,32,69,0.06)]">
    <div class="flex flex-col justify-center items-start w-full px-6 py-4 max-w-lg mx-auto">
        <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-blue-900 text-2xl">arrow_back</span>
                </a>
                <span class="material-symbols-outlined text-blue-900 text-2xl">checklist</span>
                <h1 class="text-2xl font-bold tracking-tight text-blue-900">Todo List</h1>
            </div>
            <a href="akun.html" class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center hover:scale-105 transition-transform ring-2 ring-secondary/30">
                <span class="material-symbols-outlined text-white text-sm">person</span>
            </a>
        </div>
        <p class="text-xs font-semibold uppercase tracking-widest text-slate-500 mt-1">Kelola tugas harianmu</p>
    </div>
</header>

<main class="max-w-lg mx-auto px-6 pt-8 pb-32">
    <section class="mb-10">
        <div class="flex items-end justify-between mb-3">
            <div class="flex flex-col">
                <span class="text-[0.6875rem] font-bold uppercase tracking-widest text-on-surface-variant">Daily Momentum</span>
                <h2 class="text-xl font-bold tracking-tight text-primary" id="progressPercent">0% completed</h2>
            </div>
            <span class="text-xs font-semibold text-secondary" id="progressCount">0 of 0 tasks</span>
        </div>
        <div class="h-3 w-full bg-surface-container-high rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-gradient-to-r from-primary to-primary-container rounded-full" style="width: 0%;"></div>
        </div>
    </section>

    <section class="mb-10">
        <div class="bg-surface-container-lowest rounded-xl p-2 shadow-[0_8px_24px_rgba(0,32,69,0.04)] flex items-center gap-2 group focus-within:ring-2 focus-within:ring-secondary/20 transition-all">
            <div class="pl-4 text-on-surface-variant group-focus-within:text-secondary transition-colors">
                <span class="material-symbols-outlined">add_task</span>
            </div>
            <input id="taskInput" class="flex-grow bg-transparent border-none focus:ring-0 text-sm font-medium placeholder:text-on-surface-variant/50 py-3" placeholder="Tambah tugas baru..." type="text" onkeypress="if(event.key==='Enter') addTask()"/>
            <button onclick="addTask()" class="bg-gradient-to-br from-secondary to-on-secondary-container text-white px-6 py-2.5 rounded-xl text-[11px] font-bold uppercase tracking-wider hover:translate-y-[-1px] transition-transform shadow-md">
                Add
            </button>
        </div>
    </section>

    <nav class="flex items-center gap-8 mb-8 border-b border-outline-variant/15 overflow-x-auto no-scrollbar">
        <button onclick="filterTasks('all')" id="filterAll" class="pb-4 text-sm font-bold text-primary border-b-2 border-primary whitespace-nowrap transition-all">
            All
        </button>
        <button onclick="filterTasks('active')" id="filterActive" class="pb-4 text-sm font-semibold text-on-surface-variant whitespace-nowrap hover:text-primary transition-all">
            Active
        </button>
        <button onclick="filterTasks('completed')" id="filterCompleted" class="pb-4 text-sm font-semibold text-on-surface-variant whitespace-nowrap hover:text-primary transition-all">
            Completed
        </button>
    </nav>

    <div id="tasksContainer" class="space-y-4"></div>
</main>

<nav class="fixed bottom-0 left-0 w-full z-50 bg-white/90 backdrop-blur-xl shadow-[0_-8px_24px_rgba(0,32,69,0.04)] rounded-t-[1.5rem]">
    <div class="flex justify-around items-center px-4 pt-3 pb-6 max-w-lg mx-auto">
        
        <a href="index.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-blue-900 hover:bg-slate-100 rounded-xl px-4 py-1 transition-all duration-200">
            <span class="material-symbols-outlined mb-1">home</span>
            <span class="text-[11px] font-semibold tracking-tight">Home</span>
        </a>
        
        <a href="info.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-blue-900 hover:bg-slate-100 rounded-xl px-4 py-1 transition-all duration-200">
            <span class="material-symbols-outlined mb-1">info</span>
            <span class="text-[11px] font-semibold tracking-tight">Info</span>
        </a>
        
        <a href="target.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-blue-900 hover:bg-slate-100 rounded-xl px-4 py-1 transition-all duration-200">
            <span class="material-symbols-outlined mb-1">target</span>
            <span class="text-[11px] font-semibold tracking-tight">Goals</span>
        </a>
        
        <a href="todo.html" class="flex flex-col items-center justify-center text-emerald-600 bg-emerald-50 rounded-xl px-4 py-1 transition-all duration-200">
            <span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">checklist</span>
            <span class="text-[11px] font-semibold tracking-tight">Tasks</span>
        </a>
        
        <a href="tambah.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-blue-900 hover:bg-slate-100 rounded-xl px-4 py-1 transition-all duration-200">
            <span class="material-symbols-outlined mb-1">add_circle</span>
            <span class="text-[11px] font-semibold tracking-tight">Add</span>
        </a>
        
    </div>
</nav>

<script>
    let tasks = [];
    let currentFilter = 'all';
    let nextId = 1;

    function loadDarkMode() {
        const darkMode = localStorage.getItem('darkMode');
        if (darkMode === 'enabled') {
            document.body.classList.add('dark-mode');
        }
    }

    function loadTasks() {
        const saved = localStorage.getItem('ledger_tasks');
        if (saved) {
            try {
                tasks = JSON.parse(saved);
                if (!Array.isArray(tasks)) tasks = [];
                if (tasks.length > 0) {
                    const maxId = Math.max(...tasks.map(t => t.id), 0);
                    nextId = maxId + 1;
                }
            } catch(e) { tasks = []; }
        }
        
        if (tasks.length === 0) {
            tasks = [
                { id: nextId++, text: "Follow instagram (aryo.pratama.id17)", completed: false, priority: "high", category: "Dev", dueDate: "Today" },
                { id: nextId++, text: "Review quarterly financial report", completed: true, priority: "high", category: "Work", dueDate: "Today" },
                { id: nextId++, text: "Schedule meeting with stakeholders", completed: true, priority: "medium", category: "Work", dueDate: "Tomorrow" },
                { id: nextId++, text: "Follow tiktok @ryoo_110", completed: false, priority: "high", category: "Dev", dueDate: "Today" },
                { id: nextId++, text: "Upload asset vault credentials", completed: true, priority: "low", category: "Vault", dueDate: null }
            ];
            saveTasks();
        }
    }

    function saveTasks() {
        localStorage.setItem('ledger_tasks', JSON.stringify(tasks));
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function getPriorityColor(priority) {
        switch(priority) {
            case 'high': return 'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.4)]';
            case 'medium': return 'bg-amber-400';
            default: return 'bg-gray-400';
        }
    }

    function formatDueDate(dateStr) {
        if (!dateStr) return null;
        const today = new Date().toDateString();
        const tomorrow = new Date(Date.now() + 86400000).toDateString();
        const inputDate = new Date(dateStr).toDateString();
        
        if (inputDate === today) return 'Today';
        if (inputDate === tomorrow) return 'Tomorrow';
        return dateStr;
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        const text = input.value.trim();
        if (!text) {
            alert('Masukkan tugas terlebih dahulu!');
            return;
        }
        
        tasks.unshift({
            id: nextId++,
            text: text,
            completed: false,
            priority: 'medium',
            category: 'Personal',
            dueDate: null,
            createdAt: new Date().toISOString()
        });
        
        saveTasks();
        input.value = '';
        renderTasks();
    }

    function toggleTask(id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
            task.completed = !task.completed;
            saveTasks();
            renderTasks();
        }
    }

    function deleteTask(id) {
        if (confirm('Hapus tugas ini?')) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }
    }

    function filterTasks(filter) {
        currentFilter = filter;
        
        const filterAll = document.getElementById('filterAll');
        const filterActive = document.getElementById('filterActive');
        const filterCompleted = document.getElementById('filterCompleted');
        
        const activeClass = 'pb-4 text-sm font-bold text-primary border-b-2 border-primary whitespace-nowrap transition-all';
        const inactiveClass = 'pb-4 text-sm font-semibold text-on-surface-variant whitespace-nowrap hover:text-primary transition-all';
        
        if (filter === 'all') {
            filterAll.className = activeClass;
            filterActive.className = inactiveClass;
            filterCompleted.className = inactiveClass;
        } else if (filter === 'active') {
            filterAll.className = inactiveClass;
            filterActive.className = activeClass;
            filterCompleted.className = inactiveClass;
        } else {
            filterAll.className = inactiveClass;
            filterActive.className = inactiveClass;
            filterCompleted.className = activeClass;
        }
        
        renderTasks();
    }

    function updateProgress() {
        const total = tasks.length;
        const completed = tasks.filter(t => t.completed).length;
        const percent = total > 0 ? (completed / total) * 100 : 0;
        
        document.getElementById('progressPercent').innerHTML = `${Math.floor(percent)}% completed`;
        document.getElementById('progressCount').innerHTML = `${completed} of ${total} tasks`;
        document.getElementById('progressBar').style.width = `${percent}%`;
    }

    function renderTasks() {
        let filteredTasks = tasks;
        
        if (currentFilter === 'active') {
            filteredTasks = tasks.filter(t => !t.completed);
        } else if (currentFilter === 'completed') {
            filteredTasks = tasks.filter(t => t.completed);
        }
        
        const container = document.getElementById('tasksContainer');
        
        if (filteredTasks.length === 0) {
            container.innerHTML = `
                <div class="text-center py-16 bg-surface-container-low rounded-2xl">
                    <span class="material-symbols-outlined text-5xl text-on-surface-variant/40">checklist</span>
                    <p class="mt-3 text-on-surface-variant font-medium">Belum ada tugas</p>
                    <p class="text-xs text-on-surface-variant/60 mt-1">Tambahkan tugas baru di atas</p>
                </div>
            `;
            updateProgress();
            return;
        }
        
        container.innerHTML = filteredTasks.map(task => {
            const isCompleted = task.completed;
            const priorityColor = getPriorityColor(task.priority);
            
            return `
                <div class="relative bg-surface-container-lowest p-5 rounded-xl shadow-[0_8px_24px_rgba(0,32,69,0.04)] flex items-start gap-4 group hover:bg-slate-50 transition-all ${!isCompleted ? 'border-l-4 border-secondary' : 'opacity-60'}">
                    <div class="mt-1">
                        <div onclick="toggleTask(${task.id})" class="w-6 h-6 rounded-lg border-2 ${isCompleted ? 'bg-secondary border-secondary' : 'border-outline-variant hover:border-secondary'} flex items-center justify-center cursor-pointer transition-all">
                            ${isCompleted ? '<span class="material-symbols-outlined text-[16px] text-white font-bold" style="font-variation-settings: \'FILL\' 1;">check</span>' : ''}
                        </div>
                    </div>
                    <div class="flex-grow">
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="text-base font-bold text-primary tracking-tight ${isCompleted ? 'line-through decoration-2 decoration-on-surface-variant/30' : ''}">${escapeHtml(task.text)}</h3>
                            <div class="w-2 h-2 rounded-full ${priorityColor}" title="${task.priority} Priority"></div>
                        </div>
                        <div class="flex items-center gap-3 flex-wrap">
                            ${task.dueDate ? `
                                <span class="flex items-center gap-1 text-[11px] font-semibold text-on-surface-variant uppercase tracking-wider">
                                    <span class="material-symbols-outlined text-[14px]">calendar_today</span>
                                    ${escapeHtml(formatDueDate(task.dueDate))}
                                </span>
                            ` : ''}
                            ${task.category ? `
                                <span class="flex items-center gap-1 text-[11px] font-semibold text-on-surface-variant uppercase tracking-wider">
                                    <span class="material-symbols-outlined text-[14px]">work</span>
                                    ${escapeHtml(task.category)}
                                </span>
                            ` : ''}
                            <button onclick="deleteTask(${task.id})" class="ml-auto text-on-surface-variant/30 hover:text-error transition-colors">
                                <span class="material-symbols-outlined text-base">delete</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        
        updateProgress();
    }

    loadDarkMode();
    loadTasks();
    renderTasks();
    
    window.addTask = addTask;
    window.toggleTask = toggleTask;
    window.deleteTask = deleteTask;
    window.filterTasks = filterTasks;
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('Service Worker registered with scope:', registration.scope);
                    registration.update();
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                const notification = confirm('Versi baru UangKu.id tersedia! Muat ulang untuk update?');
                                if (notification) {
                                    window.location.reload();
                                }
                            }
                        });
                    });
                })
                .catch(error => {
                    console.log('Service Worker registration failed:', error);
                });
        });
    }
    
    if (window.matchMedia('(display-mode: standalone)').matches) {
        console.log('App is running in standalone mode (installed)');
        document.body.classList.add('pwa-installed');
    }
</script>
</body>
</html>
