        var allowedHost = 'tabungankuu.web.id';
        if(!SAFE_MODE && allowedHost && location.hostname !== allowedHost){
          var el = document.createElement('div');
          el.style.position='fixed'; el.style.left=0; el.style.top=0; el.style.right=0; el.style.padding='10px';
          el.style.background='rgba(255,165,0,0.95)'; el.style.color='#000'; el.style.zIndex=99999;
          el.style.fontWeight='700'; el.style.textAlign='center';
          el.textContent='[Domain Lock] Domain ini tidak terdaftar: ' + location.hostname;
          document.documentElement.appendChild(el); console.warn('[Domain Lock] Host mismatch:', location.hostname);
        }
      }catch(e){}
      try{
        var threshold = 160;
        setInterval(function(){
          try{
            var wDiff = Math.abs(window.outerWidth - window.innerWidth);
            var hDiff = Math.abs(window.outerHeight - window.innerHeight);
            if(wDiff > threshold || hDiff > threshold){
              console.warn('[Anti-Debug] DevTools or unusual viewport detected (non-blocking).');
              if(!document.getElementById('__th_anti_debug_warn')){
                var b = document.createElement('div');
                b.id='__th_anti_debug_warn';
                b.style.position='fixed'; b.style.bottom='8px'; b.style.right='8px'; b.style.zIndex=99999;
                b.style.padding='8px 10px'; b.style.borderRadius='8px'; b.style.background='rgba(255,255,0,0.12)';
                b.style.color='#fff'; b.style.backdropFilter='blur(4px)'; b.style.fontSize='12px';
                b.textContent='Warning: DevTools detected';
                try{document.body.appendChild(b);}catch(e){}
              }
            }
          }catch(e){}
        }, 1500);
      }catch(e){}
      try{ console.debug('[Debug Protection] light-mode active'); }catch(e){}
      try{ if(!SAFE_MODE){ console.log = console.warn = console.error = function(){}; } else { console.info('[Disable Console] Skipped in SAFE_MODE'); } }catch(e){}
      try{
        var selfScript = (function(){
          var scripts = document.getElementsByTagName('script');
          for(var s=0;s<scripts.length;s++){
            if(scripts[s].src && scripts[s].src.indexOf('protected')>-1) return true;
          }
          return false;
        })();
        if(!selfScript) console.info('[Self-Defending] No external script named protected found (info only).');
      }catch(e){}
    }catch(protErr){ console.warn('[Protection Error]', protErr); }
  }, 1200);
}catch(err){ console.error('[Decoder Error]', err); }
})();</script>
