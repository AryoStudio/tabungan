<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#002045">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UangKu.id">
<link rel="apple-touch-icon" href="icons/icon-192x192.png">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    ::-webkit-scrollbar { width: 0px; }
    
    body.dark-mode {
        background-color: #121212;
        color: #e0e0e0;
    }
    body.dark-mode .bg-surface,
    body.dark-mode .bg-surface-container-lowest,
    body.dark-mode .bg-surface-container-low,
    body.dark-mode .bg-slate-50\/80,
    body.dark-mode .bg-white\/90,
    body.dark-mode .bg-gradient-to-r,
    body.dark-mode .bg-gradient-to-br {
        background-color: #1e1e1e !important;
        color: #e0e0e0 !important;
    }
    body.dark-mode .text-primary,
    body.dark-mode .text-on-surface-variant,
    body.dark-mode .text-on-surface,
    body.dark-mode .text-slate-500 {
        color: #e0e0e0 !important;
    }
    body.dark-mode .text-secondary {
        color: #4edea3 !important;
    }
    body.dark-mode .border-outline-variant\/20 {
        border-color: #333 !important;
    }
    body.dark-mode .bg-emerald-50 {
        background-color: #1a3a2a !important;
    }
    body.dark-mode .text-emerald-600 {
        color: #4edea3 !important;
    }
</style>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    "tertiary": "#002618", "surface-container-high": "#e7e8ea",
                    "secondary": "#006c49", "primary": "#002045",
                    "surface": "#f8f9fb", "on-surface": "#191c1e",
                    "surface-container-low": "#f3f4f6", "surface-container-lowest": "#ffffff",
                    "on-surface-variant": "#43474e", "secondary-container": "#6cf8bb",
                    "primary-container": "#1a365d", "on-primary": "#ffffff",
                    "error": "#ba1a1a", "error-container": "#ffdad6",
                    "on-error-container": "#93000a"
                },
                borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" }
            }
        }
    }
</script>
</head>
<body class="bg-surface text-on-surface">

<header class="fixed top-0 w-full z-50 bg-slate-50/80 backdrop-blur-xl flex justify-between items-center px-6 py-4">
    <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-3">
            <span class="material-symbols-outlined text-blue-900">arrow_back</span>
        </a>
        <span class="material-symbols-outlined text-blue-900">account_balance_wallet</span>
        <h1 class="text-xl font-bold text-blue-900 tracking-tight">UangKu.id</h1>
    </div>
    <a href="akun.html" class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center hover:scale-105 transition-transform ring-2 ring-secondary/30">
        <span class="material-symbols-outlined text-white text-sm">person</span>
    </a>
</header>

<main class="pt-24 pb-32 px-6 max-w-lg mx-auto">
    <div class="mb-10">
        <h2 class="text-4xl font-extrabold text-primary tracking-tighter leading-none mb-2">Tambah Tabungan</h2>
        <p class="text-on-surface-variant text-sm tracking-wide">Setiap rupiah yang Anda simpan adalah langkah menuju masa depan.</p>
    </div>

    <div class="space-y-8">
        <div class="bg-surface-container-lowest p-8 rounded-xl shadow-sm">
            <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant mb-4 block">NOMINAL TABUNGAN</label>
            <div class="flex items-baseline gap-2">
                <span class="text-2xl font-black text-primary opacity-50" id="currencySymbol">Rp</span>
                <input id="amountInput" type="text" class="w-full bg-transparent border-none p-0 text-5xl font-extrabold text-primary placeholder:text-surface-container-high focus:ring-0 focus:outline-none tracking-tighter" placeholder="0" value="0">
            </div>
        </div>

        <div class="grid grid-cols-1 gap-6">
            <div class="bg-surface-container-low p-6 rounded-xl">
                <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant mb-3 block">PILIH TARGET</label>
                <select id="goalSelect" class="w-full bg-surface-container-lowest border-none rounded-lg p-4 text-primary font-semibold appearance-none focus:ring-2 focus:ring-primary/5 cursor-pointer">
                    <option value="none">Tanpa Target (Tabungan Bebas)</option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-surface-container-low p-6 rounded-xl">
                    <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant mb-3 block">TANGGAL</label>
                    <input id="dateInput" type="date" class="w-full bg-surface-container-lowest border-none rounded-lg p-4 text-primary font-semibold focus:ring-2 focus:ring-primary/5">
                </div>
                <div class="bg-tertiary-container/10 p-6 rounded-xl border border-tertiary-container/5 relative overflow-hidden">
                    <label class="text-[10px] uppercase tracking-widest font-bold text-on-tertiary-container mb-3 block">KATEGORI</label>
                    <select id="categorySelect" class="w-full bg-transparent border-none text-sm font-bold text-tertiary focus:ring-0">
                        <option>Tabungan Reguler</option>
                        <option>Dana Darurat</option>
                        <option>Investasi</option>
                        <option>Liburan</option>
                        <option>Pendidikan</option>
                    </select>
                </div>
            </div>

            <div class="bg-surface-container-low p-6 rounded-xl">
                <label class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant mb-3 block">CATATAN</label>
                <textarea id="noteInput" class="w-full bg-surface-container-lowest border-none rounded-lg p-4 text-primary placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/5" placeholder="Tulis catatan singkat di sini..." rows="3"></textarea>
            </div>
        </div>

        <div class="mt-8">
            <button onclick="saveTransaction()" class="w-full py-5 px-8 rounded-xl bg-gradient-to-br from-primary to-primary-container text-white font-bold text-lg shadow-lg shadow-primary/10 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3 group">
                <span>Simpan Tabungan</span>
                <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
            </button>
        </div>
    </div>
</main>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-slate-50/80 backdrop-blur-xl z-50 rounded-t-2xl shadow-[0_-4px_20px_0_rgba(26,54,93,0.04)]">
    <a href="index.html" class="flex flex-col items-center justify-center text-slate-400 px-4 py-1 hover:text-blue-900 hover:bg-slate-100 rounded-xl transition-all duration-200">
        <span class="material-symbols-outlined">home</span>
        <span class="text-[10px] font-black uppercase tracking-[0.1em]">Home</span>
    </a>
    
    <a href="info.html" class="flex flex-col items-center justify-center text-slate-400 px-4 py-1 hover:text-blue-900 hover:bg-slate-100 rounded-xl transition-all duration-200">
        <span class="material-symbols-outlined">info</span>
        <span class="text-[10px] font-black uppercase tracking-[0.1em]">Info</span>
    </a>
    
    <a href="target.html" class="flex flex-col items-center justify-center text-slate-400 px-4 py-1 hover:text-blue-900 hover:bg-slate-100 rounded-xl transition-all duration-200">
        <span class="material-symbols-outlined">target</span>
        <span class="text-[10px] font-black uppercase tracking-[0.1em]">Goals</span>
    </a>
    
    <a href="todo.html" class="flex flex-col items-center justify-center text-slate-400 px-4 py-1 hover:text-blue-900 hover:bg-slate-100 rounded-xl transition-all duration-200">
        <span class="material-symbols-outlined">checklist</span>
        <span class="text-[10px] font-black uppercase tracking-[0.1em]">Tasks</span>
    </a>
    
    <a href="tambah.html" class="flex flex-col items-center justify-center text-emerald-600 bg-emerald-50 rounded-xl px-4 py-1 transition-all duration-200">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
        <span class="text-[10px] font-black uppercase tracking-[0.1em]">Add</span>
    </a>
</nav>

<script>
    let goals = [];
    let transactions = [];
    let currentCurrency = localStorage.getItem('currency') || 'IDR';
    let rawAmount = 0;

    function formatNumberWithDots(amount) {
        return new Intl.NumberFormat('id-ID').format(amount);
    }

    function parseAmountFromFormatted(formattedValue) {
        if (!formattedValue) return 0;
        let cleaned = formattedValue.toString().replace(/\./g, '');
        cleaned = cleaned.replace(/[^0-9]/g, '');
        return parseInt(cleaned, 10) || 0;
    }

    function updateAmountInputDisplay() {
        const inputEl = document.getElementById('amountInput');
        if (!inputEl) return;
        
        const cursorPosition = inputEl.selectionStart;
        const formattedValue = formatNumberWithDots(rawAmount);
        inputEl.value = formattedValue;
        
        setTimeout(() => {
            if (cursorPosition && formattedValue.length >= cursorPosition) {
                inputEl.setSelectionRange(cursorPosition, cursorPosition);
            }
        }, 0);
    }

    function handleAmountInput(e) {
        let inputValue = e.target.value;
        
        let cleanNumber = inputValue.replace(/\./g, '').replace(/[^0-9]/g, '');
        
        if (cleanNumber === '') {
            rawAmount = 0;
        } else {
            rawAmount = parseInt(cleanNumber, 10);
        }
        
        updateAmountInputDisplay();
    }

    function handleAmountKeydown(e) {
        if (e.key === 'Backspace' || e.key === 'Delete') {
            setTimeout(() => {
                let currentValue = e.target.value.replace(/\./g, '').replace(/[^0-9]/g, '');
                if (currentValue === '') {
                    rawAmount = 0;
                } else {
                    rawAmount = parseInt(currentValue, 10);
                }
                updateAmountInputDisplay();
            }, 10);
        }
    }

    function focusAmountInput() {
        const inputEl = document.getElementById('amountInput');
        if (inputEl) {
            setTimeout(() => {
                const length = inputEl.value.length;
                inputEl.setSelectionRange(length, length);
            }, 10);
        }
    }

    function formatCurrency(amount) {
        if (currentCurrency === 'IDR') {
            return new Intl.NumberFormat('id-ID').format(amount);
        } else if (currentCurrency === 'USD') {
            const usd = amount / 15500;
            return new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(usd);
        } else if (currentCurrency === 'SGD') {
            const sgd = amount / 11500;
            return new Intl.NumberFormat('en-SG', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(sgd);
        } else if (currentCurrency === 'MYR') {
            const myr = amount / 3500;
            return new Intl.NumberFormat('ms-MY', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(myr);
        }
        return new Intl.NumberFormat('id-ID').format(amount);
    }

    function getCurrencySymbol() {
        if (currentCurrency === 'IDR') return 'Rp';
        if (currentCurrency === 'USD') return '$';
        if (currentCurrency === 'SGD') return 'S$';
        if (currentCurrency === 'MYR') return 'RM';
        return 'Rp';
    }

    function loadCurrencySettings() {
        const saved = localStorage.getItem('currency');
        if (saved) {
            currentCurrency = saved;
        }
        const symbolEl = document.getElementById('currencySymbol');
        if (symbolEl) symbolEl.innerHTML = getCurrencySymbol();
    }

    function loadDarkMode() {
        const darkMode = localStorage.getItem('darkMode');
        if (darkMode === 'enabled') {
            document.body.classList.add('dark-mode');
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function updateGoalsDropdown() {
        let select = document.getElementById('goalSelect');
        let currentGoals = JSON.parse(localStorage.getItem('ledger_goals') || '[]');
        if (!Array.isArray(currentGoals)) currentGoals = [];
        
        select.innerHTML = '<option value="none">Tanpa Target (Tabungan Bebas)</option>';
        currentGoals.forEach((goal, index) => {
            if (goal && typeof goal.target === 'number' && typeof goal.current === 'number') {
                select.innerHTML += `<option value="${index}">${escapeHtml(goal.name)} (${getCurrencySymbol()} ${formatCurrency(goal.current)} / ${getCurrencySymbol()} ${formatCurrency(goal.target)})</option>`;
            }
        });
    }
    
    function loadData() {
        goals = JSON.parse(localStorage.getItem('ledger_goals') || '[]');
        transactions = JSON.parse(localStorage.getItem('ledger_transactions') || '[]');
        if (!Array.isArray(goals)) goals = [];
        if (!Array.isArray(transactions)) transactions = [];
    }
    
    function saveTransaction() {
        let amount = rawAmount;
        
        if (amount <= 0) {
            alert('Masukkan nominal tabungan yang valid!');
            return;
        }
        
        let goalIndex = document.getElementById('goalSelect').value;
        let date = document.getElementById('dateInput').value;
        let category = document.getElementById('categorySelect').value;
        let note = document.getElementById('noteInput').value;
        
        if (!date) {
            date = new Date().toISOString().split('T')[0];
        }
        
        let transaction = {
            id: Date.now(),
            amount: amount,
            type: 'deposit',
            category: category,
            note: note,
            date: date,
            goalIndex: goalIndex !== 'none' ? parseInt(goalIndex) : null
        };
        
        transactions.push(transaction);
        localStorage.setItem('ledger_transactions', JSON.stringify(transactions));
        
        if (goalIndex !== 'none') {
            let goalsData = JSON.parse(localStorage.getItem('ledger_goals') || '[]');
            if (goalsData[parseInt(goalIndex)] && typeof goalsData[parseInt(goalIndex)].current === 'number') {
                goalsData[parseInt(goalIndex)].current += amount;
                localStorage.setItem('ledger_goals', JSON.stringify(goalsData));
            }
        }
        
        alert('Tabungan berhasil disimpan! 🎉');
        
        rawAmount = 0;
        updateAmountInputDisplay();
        document.getElementById('noteInput').value = '';
        
        updateGoalsDropdown();
        
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 500);
    }
    
    loadCurrencySettings();
    loadDarkMode();
    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
    loadData();
    updateGoalsDropdown();
    
    const amountInput = document.getElementById('amountInput');
    if (amountInput) {
        amountInput.addEventListener('input', handleAmountInput);
        amountInput.addEventListener('keydown', handleAmountKeydown);
        amountInput.addEventListener('focus', focusAmountInput);
        rawAmount = 0;
        updateAmountInputDisplay();
    }
    
    window.saveTransaction = saveTransaction;
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('Service Worker registered with scope:', registration.scope);
                    registration.update();
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                const notification = confirm('Versi baru UangKu.id tersedia! Muat ulang untuk update?');
                                if (notification) {
                                    window.location.reload();
                                }
                            }
                        });
                    });
                })
                .catch(error => {
                    console.log('Service Worker registration failed:', error);
                });
        });
    }
    
    if (window.matchMedia('(display-mode: standalone)').matches) {
        console.log('App is running in standalone mode (installed)');
        document.body.classList.add('pwa-installed');
    }
</script>
</body>
</html>
