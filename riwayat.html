<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    "secondary": "#006c49", "primary": "#002045", "surface": "#f8f9fb",
                    "on-surface": "#191c1e", "surface-container-low": "#f3f4f6",
                    "surface-container-lowest": "#ffffff", "on-surface-variant": "#43474e",
                    "secondary-container": "#6cf8bb", "error": "#ba1a1a", "error-container": "#ffdad6"
                }
            }
        }
    }
</script>
</head>
<body class="bg-surface text-on-surface min-h-screen pb-32">

<header class="fixed top-0 w-full z-50 bg-slate-50/80 backdrop-blur-xl flex justify-between items-center px-6 py-4">
    <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-blue-900">account_balance_wallet</span>
        <h1 class="text-xl font-bold text-blue-900 tracking-tight">UangKu.id ( BETA )</h1>
    </div>
    <a href="akun.html" class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center hover:scale-105 transition-transform ring-2 ring-secondary/30">
        <span class="material-symbols-outlined text-white text-sm">person</span>
    </a>
</header>

<main class="pt-24 px-6 max-w-2xl mx-auto">
    <section class="mb-10">
        <h2 class="text-3xl font-extrabold text-primary tracking-tighter mb-2">History</h2>
        <p class="text-on-surface-variant text-sm">Catatan perjalanan finansial Anda.</p>
    </section>

    <section class="mb-8">
        <div class="flex gap-2">
            <button onclick="filterTransactions('all')" id="filterAll" class="filter-btn-active px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap transition-all duration-200 flex items-center gap-1.5 shadow-sm">
                <span class="material-symbols-outlined text-base">list_alt</span>
                Semua Transaksi
            </button>
            <button onclick="filterTransactions('deposit')" id="filterDeposit" class="filter-btn-inactive px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap transition-all duration-200 flex items-center gap-1.5">
                <span class="material-symbols-outlined text-base">trending_up</span>
                Pemasukan
            </button>
        </div>
    </section>

    <div class="bg-gradient-to-r from-primary/5 to-secondary-container/20 rounded-xl p-4 mb-8 flex justify-between items-center">
        <div>
            <p class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">Total Transaksi</p>
            <p class="text-2xl font-bold text-primary" id="totalTransactions">0</p>
        </div>
        <div class="text-right">
            <p class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">Total Pemasukan</p>
            <p class="text-2xl font-bold text-secondary" id="totalIncome">Rp 0</p>
        </div>
        <div class="w-px h-10 bg-outline-variant/30"></div>
        <div class="text-right">
            <p class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">Rata-rata</p>
            <p class="text-2xl font-bold text-primary" id="averageIncome">Rp 0</p>
        </div>
    </div>

    <div id="transactionsContainer" class="space-y-6"></div>
</main>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-slate-50/80 backdrop-blur-xl z-50 rounded-t-2xl shadow-[0_-4px_20px_0_rgba(26,54,93,0.04)]">
    <a href="index.html" class="flex flex-col items-center justify-center text-slate-400 px-4 py-1 hover:text-blue-900 transition-colors">
        <span class="material-symbols-outlined">home</span>
        <span class="text-[10px] uppercase font-bold">Home</span>
    </a>
    <a href="riwayat.html" class="flex flex-col items-center justify-center text-emerald-600 bg-emerald-50 rounded-xl px-4 py-1">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
        <span class="text-[10px] uppercase font-bold">History</span>
    </a>
    <a href="target.html" class="flex flex-col items-center justify-center text-slate-400 px-4 py-1 hover:text-blue-900 transition-colors">
        <span class="material-symbols-outlined">target</span>
        <span class="text-[10px] uppercase font-bold">Goals</span>
    </a>
    <a href="tambah.html" class="flex flex-col items-center justify-center text-slate-400 px-4 py-1 hover:text-blue-900 transition-colors">
        <span class="material-symbols-outlined">add_circle</span>
        <span class="text-[10px] uppercase font-bold">Add</span>
    </a>
</nav>

<script>
    let currentFilter = 'all';
    
    function formatRupiah(amount) {
        return new Intl.NumberFormat('id-ID').format(amount);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function updateStats(transactions) {
        let totalIncome = 0;
        let depositCount = 0;
        
        transactions.forEach(t => {
            if (t && t.type === 'deposit' && typeof t.amount === 'number') {
                totalIncome += t.amount;
                depositCount++;
            }
        });
        
        document.getElementById('totalTransactions').innerHTML = transactions.length;
        document.getElementById('totalIncome').innerHTML = 'Rp ' + formatRupiah(totalIncome);
        
        let avg = depositCount > 0 ? totalIncome / depositCount : 0;
        document.getElementById('averageIncome').innerHTML = 'Rp ' + formatRupiah(Math.floor(avg));
    }
    
    function filterTransactions(type) {
        currentFilter = type;
        loadTransactions();
        
        const allBtn = document.getElementById('filterAll');
        const depositBtn = document.getElementById('filterDeposit');
        
        if (type === 'all') {
            allBtn.className = 'filter-btn-active px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap transition-all duration-200 flex items-center gap-1.5 shadow-sm';
            depositBtn.className = 'filter-btn-inactive px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap transition-all duration-200 flex items-center gap-1.5';
        } else {
            allBtn.className = 'filter-btn-inactive px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap transition-all duration-200 flex items-center gap-1.5';
            depositBtn.className = 'filter-btn-active px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap transition-all duration-200 flex items-center gap-1.5 shadow-sm';
        }
    }
    
    function loadTransactions() {
        let allTransactions = JSON.parse(localStorage.getItem('ledger_transactions') || '[]');
        if (!Array.isArray(allTransactions)) allTransactions = [];
        
        let filtered = allTransactions;
        if (currentFilter !== 'all') {
            filtered = allTransactions.filter(t => t && t.type === currentFilter);
        }
        
        updateStats(allTransactions);
        
        let container = document.getElementById('transactionsContainer');
        
        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="text-center py-16 bg-surface-container-low rounded-2xl">
                    <span class="material-symbols-outlined text-5xl text-on-surface-variant/40">history</span>
                    <p class="mt-3 text-on-surface-variant font-medium">Belum ada transaksi</p>
                    <p class="text-xs text-on-surface-variant/60 mt-1">Mulai tambah tabungan di halaman Add</p>
                    <a href="tambah.html" class="mt-4 inline-block bg-primary text-white px-5 py-2 rounded-xl text-sm font-semibold hover:bg-primary/90 transition-colors">+ Tambah Tabungan</a>
                </div>
            `;
            return;
        }
        
        let grouped = {};
        filtered.forEach(t => {
            if (t && t.date) {
                let date = t.date;
                if (!grouped[date]) grouped[date] = [];
                grouped[date].push(t);
            }
        });
        
        let sortedDates = Object.keys(grouped).sort().reverse();
        
        container.innerHTML = sortedDates.map(date => {
            let totalPerDay = 0;
            grouped[date].forEach(t => {
                if (t && t.type === 'deposit' && typeof t.amount === 'number') {
                    totalPerDay += t.amount;
                }
            });
            
            return `
                <div class="bg-surface-container-low rounded-xl overflow-hidden">
                    <div class="px-4 py-3 bg-surface-container-high/50 border-b border-outline-variant/20 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm text-on-surface-variant/60">calendar_today</span>
                            <span class="text-xs font-bold text-on-surface-variant uppercase tracking-wide">${new Date(date).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</span>
                        </div>
                        ${totalPerDay > 0 ? `<span class="text-xs font-bold text-secondary">+ Rp ${formatRupiah(totalPerDay)}</span>` : ''}
                    </div>
                    <div class="divide-y divide-outline-variant/10">
                        ${grouped[date].map(t => `
                            <div class="p-4 bg-surface-container-lowest hover:bg-surface-container-high/30 transition-colors">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-xl ${t.type === 'deposit' ? 'bg-secondary-container' : 'bg-error-container'} flex items-center justify-center">
                                            <span class="material-symbols-outlined ${t.type === 'deposit' ? 'text-secondary' : 'text-error'} text-base">${t.type === 'deposit' ? 'savings' : 'payments'}</span>
                                        </div>
                                        <div>
                                            <h4 class="font-bold text-primary text-sm">${escapeHtml(t.category) || 'Tabungan'}</h4>
                                            <p class="text-xs text-on-surface-variant/60">${escapeHtml(t.note) || 'Tidak ada catatan'}</p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <span class="${t.type === 'deposit' ? 'text-secondary' : 'text-error'} font-bold">${t.type === 'deposit' ? '+' : '-'} Rp ${formatRupiah(t.amount)}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
    }
    
    loadTransactions();
    
    window.filterTransactions = filterTransactions;
</script>

<style>
    .filter-btn-active {
        background-color: #002045;
        color: white;
        box-shadow: 0 2px 6px rgba(0, 32, 69, 0.15);
    }
    
    .filter-btn-inactive {
        background-color: #ffffff;
        color: #43474e;
        border: 1px solid #e1e2e4;
    }
    
    .filter-btn-inactive:hover {
        background-color: #f3f4f6;
        color: #002045;
        border-color: #c4c6cf;
    }
</style>
</body>
</html>
